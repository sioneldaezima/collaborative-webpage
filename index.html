<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collaborative Webpage</title>
  <!-- Styler: put CSS in style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== Header Designer: title + navigation bar ===== -->
  <header>
    <h1>Collaborative Webpage</h1>
    <nav aria-label="Main navigation">
      <a href="#">Home</a>
      <a href="#content">About</a>
      <a href="#images">Gallery</a>
      <a href="#button">Contact</a>
    </nav>
  </header>

  <main>
    <!-- ===== Content Creator: article / paragraph section ===== -->
    <section id="content">
      <h2>About Our Website</h2>
      <p>
        Welcome sa webpage namin, by Buffe, Rohn, Jasper, Dan, Antonio, and Sean
      </p>

      <article>
        <h3>Our Purpose</h3>
        <p>
          Mag push, pull, commit, and merge
        </p>
      </article>
    </section>

    <!-- ===== Image Manager: image(s) with attribution ===== -->
    <section id="images">
      <figure>
        <img src="images/lago-di-braies.jpg" alt="A wooden boathouse beside a turquoise alpine lake, with forested mountains in the background." width="600">
        <figcaption>
          Photo by <a href="https://unsplash.com/@lucabravo" target="_blank" rel="noopener noreferrer">Luca Bravo</a> on
          <a href="https://unsplash.com/" target="_blank" rel="noopener noreferrer">Unsplash</a>.
        </figcaption>
      </figure>
    </section>

    <!-- ===== Button Maker: functional button ===== -->
    <section id="button">
      <button id="button-action" type="button">Click me</button>
    </section>
  </main>

  <!-- Button Maker: put JavaScript in script.js -->
  <script src="script.js"></script>
</body>
</html>
